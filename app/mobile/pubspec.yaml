name: exnota
description: Save voice memos to Notion.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.0.1

environment:
  sdk: ">=3.1.2 <4.0.0"

dependencies:
  drift: ^2.12.1
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.3
  http: ^1.1.0
  intl: any
  oauth2: ^2.0.2
  path_provider: ^2.0.0
  path: ^1.8.3
  riverpod_annotation: ^2.2.0
  url_launcher: ^6.1.14
  # Use this specific commit otherwise an APK cannot be built due to no
  # `namespace` in build.gradle.
  audio_waveforms:
    git:
      url: https://github.com/SimformSolutionsPvtLtd/audio_waveforms.git
      ref: ea69c5ec00e5c7a18b8d87d22999ad5c4ddf71ca
  http_parser: ^4.0.2
  drift_db_viewer: ^2.0.0
  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  nanoid2: ^2.0.1
  collection: ^1.17.2
  flutter_animated_icons: ^1.0.1
  lottie: ^1.4.3
  permission_handler: ^11.0.1
  app_links: ^3.4.5
  firebase_core: ^2.24.1
  firebase_crashlytics: ^3.4.7
  device_info_plus: ^9.1.1
  pocketbase: ^0.18.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.3.0
  flutter_secure_storage: ^9.0.0
  flutter_settings_ui: ^3.0.0
  go_router: ^13.2.0
  connectivity_plus: ^5.0.2
  retry: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  freezed: ^2.4.5
  drift_dev: ^2.12.1
  riverpod_generator: ^3.0.0-dev.3
  custom_lint: ^0.5.3
  riverpod_lint: ^2.3.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
