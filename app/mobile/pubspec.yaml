name: exnota
description: Save voice memos to Notion.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.0.1

environment:
  sdk: ">=3.1.2 <4.0.0"

dependencies:
  drift: ^2.12.1
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.3
  http: ^1.1.0
  intl: any
  oauth2: ^2.0.2
  path_provider: ^2.0.0
  path: ^1.8.3
  riverpod_annotation: ^2.2.0
  sqlite3_flutter_libs: ^0.5.0
  uni_links: ^0.5.1
  url_launcher: ^6.1.14
  audio_waveforms: ^1.0.4
  http_parser: ^4.0.2
  drift_db_viewer: ^2.0.0
  logger: ^2.0.2+1
  json_annotation: ^4.8.1
  nanoid2: ^2.0.1
  collection: ^1.17.2
  flutter_animated_icons: ^1.0.1
  lottie: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  freezed: ^2.4.5
  drift_dev: ^2.12.1
  riverpod_generator: ^3.0.0-dev.3
  custom_lint: ^0.5.3
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
