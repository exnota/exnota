name: exnota
description: Save voice memos to Notion.

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 0.0.2

environment:
  sdk: ">=3.3.1 <4.0.0"
  flutter: "3.19.3"

dependencies:
  drift: ^2.12.1
  flutter:
    sdk: flutter
  freezed_annotation: ^2.4.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  intl: any
  oauth2: ^2.0.2
  path_provider: ^2.0.0
  path: ^1.8.3
  riverpod_annotation: ^2.3.5
  url_launcher: ^6.2.6
  # Use this specific commit otherwise an APK cannot be built due to no
  # `namespace` in build.gradle.
  audio_waveforms:
    git:
      url: https://github.com/SimformSolutionsPvtLtd/audio_waveforms.git
      ref: ea69c5ec00e5c7a18b8d87d22999ad5c4ddf71ca
  http_parser: ^4.0.2
  drift_db_viewer: ^2.0.0
  logger: ^2.0.2
  json_annotation: ^4.8.1
  nanoid2: ^2.0.1
  collection: ^1.17.2
  flutter_animated_icons: ^1.0.1
  lottie: ^1.4.3
  permission_handler: ^11.0.1
  app_links: ^3.4.5
  firebase_core: ^2.24.1
  firebase_crashlytics: ^3.4.7
  device_info_plus: ^9.1.1
  pocketbase: ^0.18.0
  sqlcipher_flutter_libs: ^0.6.0
  sqlite3: ^2.4.0
  flutter_secure_storage: ^9.0.0
  flutter_settings_ui: ^3.0.0
  go_router: ^13.2.0
  retry: ^3.1.2
  fake_async: ^1.3.1
  clock: ^1.1.1
  audio_session: ^0.1.18
  flutter_sound: ^9.4.6
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  freezed: ^2.4.5
  drift_dev: ^2.12.1
  riverpod_generator: ^3.0.0-dev.3
  custom_lint: ^0.5.11
  custom_lint_rules:
    path: ./custom_lint_rules
  riverpod_lint: ^2.3.0
  mockito: ^5.4.4

dependency_overrides:
  # TODO: Remove this when no longer needed
  #
  # This override resolves the following dependency resolution error. Hopefully
  # it causes no issues because we don't use the web platform, which is
  # presumably why it's needed by sqlite3 (and probably flutter_sound_web):
  #
  # > Because no versions of sqlite3 match >2.4.0 <3.0.0 and sqlite3 2.4.0 depends on js ^0.6.4, sqlite3 ^2.4.0 requires js ^0.6.4.
  # > And because flutter_sound >=9.4.6 depends on flutter_sound_web 9.4.6 which depends on js ^0.7.1, sqlite3 ^2.4.0 is incompatible with flutter_sound
  # >   >=9.4.6.
  # > So, because exnota depends on both sqlite3 ^2.4.0 and flutter_sound ^9.4.6, version solving failed.
  js: ^0.7.1

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
