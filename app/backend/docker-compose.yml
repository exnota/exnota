version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    # command:
    #   - --encryptionEnv #optional
    #   - ENCRYPTION #optional
    # environment:
    #   ENCRYPTION: example #optional
    ports:
      - "8080:8080"
    volumes:
      - ./pb_data:/pb/pb_data
      # - /path/to/public:/pb_public
    healthcheck:
      # (recommended) since v0.10.0
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/api/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 5
