# fly.toml app configuration file generated for exnota-backend-monitor on 2024-01-21T19:19:54+10:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "exnota-backend-monitor"
primary_region = "syd"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source="exnota_backend_monitor_data"
  destination="/app/data"
